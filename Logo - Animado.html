<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commandu — Logo Animado</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f9f9f9;
  }

  .logo-wrapper {
    width: 100%;
    max-width: 700px;
  }

  .draw-path {
    stroke-width: 90;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: draw 6s ease-in-out infinite;
  }

  .pop-dot {
    opacity: 0;
    transform: scale(0);
    transform-origin: center;
    transform-box: fill-box;
    animation: pop 6s ease-in-out infinite;
  }

  @keyframes draw {
    0%   { stroke-dashoffset: 100; }
    25%  { stroke-dashoffset: 0; }
    45%  { stroke-dashoffset: 0; }
    70%  { stroke-dashoffset: 100; }
    100% { stroke-dashoffset: 100; }
  }

  @keyframes pop {
    0%   { opacity: 0; transform: scale(0); }
    24%  { opacity: 0; transform: scale(0); }
    28%  { opacity: 1; transform: scale(1); }
    44%  { opacity: 1; transform: scale(1); }
    50%  { opacity: 0; transform: scale(0); }
    100% { opacity: 0; transform: scale(0); }
  }
</style>
</head>
<body>

<div class="logo-wrapper">
   <svg width="100%" height="100%" viewBox="-60 -60 1970 1894" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g id="Logo/Padrão">
      <path class="draw-path" id="Vector 1" pathLength="100" d="M1708.98 298.338C1748.15 448.289 1826.19 812.57 1824.99 1070.09C1823.49 1391.98 1611.46 1553.93 1340.92 1534.93C1070.38 1515.94 824.847 1167.05 872.354 692.709C919.861 218.364 1106.61 197.186 1245.91 237.358C1398.43 281.344 1426.94 549.207 1114.39 677.214C704.329 845.16 461.485 886.233 296.269 868.152C74.237 843.854 -36.1322 598.24 107.742 448.789C282.411 267.348 563.309 395.306 593.813 786.179C616.047 1071.07 683.326 1653.32 248.763 1744.37C19.7293 1792.35 -80.789 1455.48 178.252 1298.51C338.276 1201.54 772.839 1108.07 1426.94 1159.56" stroke="#2C2C2C" stroke-width="50" stroke-linecap="round"/>

      <path class="pop-dot" id="Vector 2" d="M1350.1 90.4058C1360.11 130.669 1385.01 150.624 1440.62 143.427C1510.13 134.43 1527.95 44.4208 1461.94 18.4293C1379.15 -14.1706 1332.6 19.967 1350.1 90.4058Z" fill="#2C2C2C" stroke="#2C2C2C" stroke-width="30" stroke-linecap="round"/>
    </g>
  </svg>
</div>

</body>
</html>
